name: Desktop builds

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            platform: mac
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            platform: mac
            arch: x64
          - name: Windows x64
            os: windows-2022
            platform: win
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test maze and game logic
        run: npm test
      - name: Build game assets
        run: npm run build
      - name: Package desktop application
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: NACHTGANG-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
