name: Native macOS builds

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test native application and game logic
        run: make test
      - name: Build and verify signed application
        run: make build
      - name: Verify architecture and archive application
        run: |
          test "$(lipo -archs release/Blacksite.app/Contents/MacOS/BlacksiteMac)" = arm64
          ditto -c -k --sequesterRsrc --keepParent release/Blacksite.app release/Blacksite-macOS-arm64.zip
      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: Blacksite-macOS-arm64
          path: release/Blacksite-macOS-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
