name: Native macOS builds

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test native application and game logic
        run: make test
      - name: Build and verify signed application
        run: make build
      - name: Verify architecture and archive application
        run: |
          lipo -verify_arch ${{ matrix.arch }} release/Blacksite.app/Contents/MacOS/BlacksiteMac
          ditto -c -k --sequesterRsrc --keepParent release/Blacksite.app release/Blacksite-macOS-${{ matrix.arch }}.zip
      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: Blacksite-macOS-${{ matrix.arch }}
          path: release/Blacksite-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
