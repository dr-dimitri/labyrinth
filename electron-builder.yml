appId: de.labyrinth.nachtgang
productName: NACHTGANG
asar: true
directories:
  output: release
files:
  - dist/**/*
  - electron/main.cjs
  - package.json
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
publish: null
npmRebuild: false

mac:
  icon: build/icons/nachtgang.icns
  category: public.app-category.adventure-games
  target:
    - dmg
    - zip
  # Local development builds: ad-hoc signature, no Developer ID or Apple account.
  identity: '-'
  hardenedRuntime: false
  notarize: false

win:
  icon: build/icons/nachtgang.ico
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: '${productName}-${version}-windows-${arch}-Setup.${ext}'

portable:
  artifactName: '${productName}-${version}-windows-${arch}-Portable.${ext}'
